<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta http-equiv="refresh" content="1;url=https://script.google.com/macros/s/AKfycbx3tRa9C7QDaL497zK4FLJUcbEstAwrnvlT4Oua3gRhPLJyD4FP0yYvBbvWSTPxNHfG/exec">
  <title>Ficha de Necesidades de Apoyo Educativo</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:#f3f6fa;
      font-family:Arial,Helvetica,sans-serif;
      color:#253347;
    }
    .card{
      width:min(560px,100%);
      background:#fff;
      border-radius:18px;
      padding:28px;
      box-shadow:0 6px 24px rgba(0,0,0,.08);
      text-align:center;
    }
    h1{margin:0 0 10px;color:#0a518e;font-size:24px}
    p{line-height:1.5;color:#5a6979}
    .spinner{
      width:42px;height:42px;margin:20px auto;
      border:4px solid #d9e5ef;border-top-color:#0b60a5;
      border-radius:50%;animation:giro .8s linear infinite
    }
    a{
      display:inline-block;margin-top:12px;padding:12px 18px;
      background:#0b60a5;color:white;text-decoration:none;
      border-radius:10px;font-weight:700
    }
    @keyframes giro{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Ficha de Necesidades de Apoyo Educativo</h1>
    <p>EPOANT · Orientador Educativo: Dr. Eriobeth Vargas Hernández</p>
    <div class="spinner" aria-hidden="true"></div>
    <p>Abriendo la plataforma segura…</p>

  </main>
  <script>

</html>
