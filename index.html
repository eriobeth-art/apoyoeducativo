<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Ficha de Necesidades de Apoyo Educativo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif}
    body{overflow:hidden}
    #carga{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#f3f6fa;color:#0a518e;z-index:10;text-align:center;padding:24px
    }
    #carga .box{max-width:520px}
    #carga h1{font-size:22px;margin:0 0 8px}
    #carga p{font-size:14px;color:#536274;margin:0}
    iframe{display:block;width:100%;height:100%;border:0;background:white}
    .fallback{
      position:fixed;left:12px;right:12px;bottom:12px;z-index:20;text-align:center;
      font-size:12px;color:#536274
    }
    .fallback a{color:#0b60a5;font-weight:700}
  </style>
</head>
<body>
  <div id="carga" aria-live="polite">
    <div class="box">
      <h1>Ficha de Necesidades de Apoyo Educativo</h1>
      <p>EPOANT · Orientador Educativo: Dr. Eriobeth Vargas Hernández</p>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbx3tRa9C7QDaL497zK4FLJUcbEstAwrnvlT4Oua3gRhPLJyD4FP0yYvBbvWSTPxNHfG/exec"
    title="Ficha de Necesidades de Apoyo Educativo"
    loading="eager"
    allow="clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div class="fallback" id="fallback">
    Si la aplicación no carga,
    <a href="https://script.google.com/macros/s/AKfycbx3tRa9C7QDaL497zK4FLJUcbEstAwrnvlT4Oua3gRhPLJyD4FP0yYvBbvWSTPxNHfG/exec" target="_top" rel="noopener">abrir directamente</a>.
  </div>

  <script>
    const frame = document.getElementById('app');
    const loader = document.getElementById('carga');
    frame.addEventListener('load', () => {
      loader.style.display = 'none';
    });
    setTimeout(() => {
      loader.style.display = 'none';
    }, 8000);
  </script>
</body>
</html>
