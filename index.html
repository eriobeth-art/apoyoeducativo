<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Ficha de Necesidades de Apoyo Educativo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fa}
    iframe{display:block;width:100%;height:100%;border:0;background:white}
    #carga{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#f3f6fa;z-index:10;font-family:Arial,Helvetica,sans-serif;color:#0a518e
    }
    .box{text-align:center;padding:24px}
    .spinner{
      width:42px;height:42px;margin:18px auto;border:4px solid #d8e4ee;
      border-top-color:#0b60a5;border-radius:50%;animation:giro .8s linear infinite
    }
    @keyframes giro{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="carga">
    <div class="box">
      <strong>Ficha de Necesidades de Apoyo Educativo</strong>
      <div class="spinner"></div>
      <div>Cargando plataforma…</div>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbx3tRa9C7QDaL497zK4FLJUcbEstAwrnvIT4Oua3gRhPLJyD4FP0yYvBbvWSTPxNHfG/exec"
    title="Ficha de Necesidades de Apoyo Educativo"
    allow="clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const f=document.getElementById('app');
    const c=document.getElementById('carga');
    f.addEventListener('load',()=>{ c.style.display='none'; });
    setTimeout(()=>{ c.style.display='none'; },8000);
  </script>
</body>
</html>
